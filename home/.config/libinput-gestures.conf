# libinput-gestures config
# Only 3+ finger swipes work here -- libinput reports 2-finger motion as
# scrolling, so 2-finger back/forward is handled natively by the browser.

# 3-finger swipe up: open skippy-xd window picker (one-shot, no daemon)
gesture swipe up    3  skippy-xd

# 3-finger swipe left/right: switch to the workspace left/right of current
gesture swipe left  3  sh -c "$HOME/.config/chadwm/scripts/left_workspace.sh"
gesture swipe right 3  sh -c "$HOME/.config/chadwm/scripts/right_workspace.sh"
