<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Panel: ThinkPad P16s Gen 4 AMD, 1920x1200 @ 16" (~141 DPI), RGB-stripe, 100% sRGB.
    Xft.dpi=96 (1x logical), DisplaySize 344x215mm in xorg.conf.d.
  -->

  <!-- Tell fontconfig its DPI so point-to-pixel conversion matches Xft.dpi=96.
       Without this fontconfig silently defaults to 75 DPI internally. -->
  <match target="pattern">
    <edit name="dpi" mode="assign"><double>96</double></edit>
  </match>

  <!-- Override the system 10-sub-pixel-none.conf at pattern level so apps that
       query the pattern before font selection also see rgba=rgb. -->
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>

  <match target="font">
    <!-- antialiasing on -->
    <edit name="antialias" mode="assign"><bool>true</bool></edit>

    <!-- hinting on, light: snaps to pixel grid without distorting shapes -->
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>

    <!-- use the font's own bytecode hinter, not freetype's autohinter -->
    <edit name="autohint" mode="assign"><bool>false</bool></edit>

    <!-- subpixel (LCD) rendering, RGB stripe order + default lcd filter -->
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>

    <!-- never use ugly low-res embedded bitmaps; always render the outline -->
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!--
    Apple SF fonts: render the macOS way (grayscale, no hinting).
    SF ships with minimal hinting and is tuned for Apple's rasterizer, so the
    global subpixel+hintslight rule above makes it look chunky/wrong. These
    per-family overrides make it as clean as SF gets on freetype.
    No-op until the SF .ttf/.otf files are installed in ~/.fonts.
  -->
  <match target="font">
    <test name="family" compare="contains"><string>SF Pro</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>SF Mono</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!-- Sensible default families so generic requests resolve to your good fonts.
       Swap Inter -> "SF Pro Text" below once SF is installed if you want SF as
       the system default sans. -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>SF Pro Text</family></prefer>
  </alias>

</fontconfig>
